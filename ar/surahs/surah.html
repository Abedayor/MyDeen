    <div class="top-bar">

        <div class="settings-container">

            </div>
        </div>
        <div class="langue">

                            <a id="instagramLink" href="https://www.instagram.com/mydeenbooksite" target="_blank" rel="noopener noreferrer">

            </div>
    
            <div class="buttons">

                <img id="prev-btn" title="- 3sec" aria-label="- 3sec" src="../../assets/images/skip-back.svg" alt="flèche">

                <img id="next-btn" title="+ 3sec" aria-label="+ 3sec" src="../../assets/images/skip-forward.svg" alt="fleche">
                <img id="close-btn" title="Répéter" aria-label="Répéter" src="../../assets/images/x.svg" alt="fleche">
